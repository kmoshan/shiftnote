[package]
name = "shiftnote"
version = "0.2.0"
description = "ShiftNote - 轻量级交接班管理与事项跟踪"
authors = ["ShiftNote"]
edition = "2021"
rust-version = "1.89.0"

[lib]
name = "shiftnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled", "backup", "serialize", "hooks", "limits"] }
argon2 = { version = "0.5.3", features = ["zeroize"] }
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
# Enable key-schedule zeroization in the AES backend shared by aes-gcm.
aes = { version = "0.8.4", features = ["zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }
getrandom = "0.3.4"
fs2 = "0.4.3"
sha2 = "0.10.9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# 开发时也尽量减小体积增长
[profile.dev]
incremental = true
